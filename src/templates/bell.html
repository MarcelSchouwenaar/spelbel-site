<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{APP_NAME}} – {{DOORBELL_NAME}}</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" type="image/svg+xml" href="/images/app-icon-v1.svg">
  <link rel="manifest" href="{{MANIFEST_HREF}}">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SpelBel">
  <meta name="theme-color" content="#EE7533">
</head>
<body class="bell-page">
  <header>
    <div class="logo"><img src="/images/logo.svg" alt="{{APP_NAME}} Logo"></div>
  </header>
  <div class="card">

    <h1>{{DOORBELL_NAME}}</h1>
    {{LOCATION}}
    <p class="desc">Meld je aan om een melding te krijgen als de bel gaat.</p>

    {{PUSH_SECTION}}

    {{OTHER_CHANNELS}}{{EMPTY}}
    <div class="card-footer">{{APP_NAME}}</div>
  </div>
</body>
</html>
